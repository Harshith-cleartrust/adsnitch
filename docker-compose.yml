services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: adsnitch
      POSTGRES_PASSWORD: adsnitch
      POSTGRES_DB: adsnitch
    ports:
      - "5432:5432"
    volumes:
      - adsnitch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adsnitch -d adsnitch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adsnitch_pg:
